<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14" />
      <stop offset="50%" stop-color="#0c111d" />
      <stop offset="100%" stop-color="#05080f" />
    </linearGradient>

    <!-- Main Typographic Accent Gradient -->
    <linearGradient id="cyanVioletGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="45%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glowing Accent Line Gradient -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0" />
      <stop offset="25%" stop-color="#00f0ff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="1" />
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="tagBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <!-- Radial Glows for Ambiance -->
    <radialGradient id="cyanGlow" cx="20%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="violetGlow" cx="80%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>

    <!-- Background Grid Pattern -->
    <pattern id="techGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08" />
      <circle cx="0" cy="0" r="1" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, "Cascadia Code", "Segoe UI Mono", "Roboto Mono", Menlo, Consolas, monospace;
      }
      .brand-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 900;
        letter-spacing: 7px;
      }
      .tag-text {
        font-family: ui-monospace, SFMono-Regular, "Cascadia Code", Menlo, monospace;
        font-size: 11px;
        letter-spacing: 1.5px;
        font-weight: 600;
      }
      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      .cursor {
        animation: blink 1.1s infinite;
      }
    </style>
  </defs>

  <!-- 1. Background Fill & Grid -->
  <rect width="1200" height="300" fill="url(#bgGrad)" />
  <rect width="1200" height="300" fill="url(#cyanGlow)" />
  <rect width="1200" height="300" fill="url(#violetGlow)" />
  <rect width="1200" height="300" fill="url(#techGrid)" />

  <!-- 2. Outer Technical Border Frame -->
  <rect x="15" y="15" width="1170" height="270" rx="6" fill="none" stroke="#1e293b" stroke-width="1.5" />
  <rect x="18" y="18" width="1164" height="264" rx="4" fill="none" stroke="#00f0ff" stroke-width="0.75" stroke-opacity="0.25" />

  <!-- Corner Brackets -->
  <path d="M 15 45 L 15 15 L 45 15" fill="none" stroke="#00f0ff" stroke-width="2.5" />
  <path d="M 1155 15 L 1185 15 L 1185 45" fill="none" stroke="#a855f7" stroke-width="2.5" />
  <path d="M 15 255 L 15 285 L 45 285" fill="none" stroke="#00f0ff" stroke-width="2.5" />
  <path d="M 1155 285 L 1185 285 L 1185 255" fill="none" stroke="#a855f7" stroke-width="2.5" />

  <!-- 3. Top Terminal Bar -->
  <line x1="15" y1="48" x2="1185" y2="48" stroke="#1e293b" stroke-width="1.2" />

  <!-- Window Dots -->
  <circle cx="36" cy="32" r="4.5" fill="#ef4444" opacity="0.9" />
  <circle cx="52" cy="32" r="4.5" fill="#eab308" opacity="0.9" />
  <circle cx="68" cy="32" r="4.5" fill="#10b981" opacity="0.9" />

  <!-- Terminal Session Header -->
  <text x="92" y="36" class="mono-text" font-size="12" fill="#64748b" font-weight="600" letter-spacing="1">
    TERMINAL // <tspan fill="#38bdf8">AYUSH.EXE</tspan> [x86_64-linux]
  </text>

  <!-- Top Right Status Indicators (Anchor End to prevent clipping) -->
  <g transform="translate(1140, 36)">
    <circle cx="-230" cy="-4" r="3.5" fill="#10b981" />
    <text x="-215" y="0" class="mono-text" font-size="11" fill="#10b981" font-weight="700" letter-spacing="1">STATUS: ONLINE</text>
    <text x="-95" y="0" class="mono-text" font-size="11" fill="#64748b" letter-spacing="0.5">| CSE // INDIA</text>
  </g>

  <!-- 4. Central Focal Typography: AYUSH.EXE -->
  <g transform="translate(600, 126)" text-anchor="middle">
    <!-- Ambient Shadow for Headpiece -->
    <text x="0" y="0" class="brand-title" font-size="52" fill="#000000" opacity="0.6" filter="url(#subtleGlow)">AYUSH.EXE</text>
    <text x="0" y="0" class="brand-title" font-size="52" fill="url(#cyanVioletGrad)" filter="url(#subtleGlow)">AYUSH.EXE</text>
  </g>

  <!-- Identity Sub-line -->
  <g transform="translate(600, 162)" text-anchor="middle">
    <text x="0" y="0" class="mono-text" font-size="14.5" fill="#e2e8f0" font-weight="600" letter-spacing="3.5">
      AYUSH KUMAR <tspan fill="#38bdf8" font-weight="400">|</tspan> <tspan fill="#94a3b8">COMPUTER SCIENCE &amp; ENGINEERING</tspan>
    </text>
  </g>

  <!-- Glowing Accent Divider Line -->
  <line x1="280" y1="180" x2="920" y2="180" stroke="url(#lineGrad)" stroke-width="1.8" />
  <polygon points="600,176 605,180 600,184 595,180" fill="#00f0ff" />

  <!-- 5. Technology & Systems Tag Pills -->
  <g transform="translate(600, 216)">
    <!-- Tag 1: AI & ML -->
    <g transform="translate(-240, 0)">
      <rect x="-85" y="-14" width="170" height="26" rx="4" fill="url(#tagBgGrad)" stroke="#38bdf8" stroke-width="0.9" stroke-opacity="0.6" />
      <text x="0" y="4" class="tag-text" fill="#38bdf8" text-anchor="middle">AI &amp; MACHINE LEARNING</text>
    </g>

    <!-- Tag 2: SOFTWARE & SYSTEMS -->
    <g transform="translate(0, 0)">
      <rect x="-85" y="-14" width="170" height="26" rx="4" fill="url(#tagBgGrad)" stroke="#818cf8" stroke-width="0.9" stroke-opacity="0.6" />
      <text x="0" y="4" class="tag-text" fill="#c084fc" text-anchor="middle">SOFTWARE &amp; SYSTEMS</text>
    </g>

    <!-- Tag 3: LINUX & TOOLING -->
    <g transform="translate(240, 0)">
      <rect x="-85" y="-14" width="170" height="26" rx="4" fill="url(#tagBgGrad)" stroke="#a855f7" stroke-width="0.9" stroke-opacity="0.6" />
      <text x="0" y="4" class="tag-text" fill="#e879f9" text-anchor="middle">LINUX &amp; TOOLING</text>
    </g>
  </g>

  <!-- 6. Bottom Terminal Motto Line -->
  <g transform="translate(600, 262)" text-anchor="middle">
    <!-- Diamond Markers -->
    <text x="-160" y="-1" class="mono-text" font-size="11" fill="#38bdf8" opacity="0.6">◇ ──</text>
    <text x="0" y="0" class="mono-text" font-size="13" fill="#f8fafc" font-weight="700" letter-spacing="4">
      BUILD. EXPLORE. REPEAT.<tspan class="cursor" fill="#00f0ff">_</tspan>
    </text>
    <text x="160" y="-1" class="mono-text" font-size="11" fill="#a855f7" opacity="0.6">── ◇</text>
  </g>

  <!-- Bottom Coordinates Microcopy -->
  <text x="35" y="272" class="mono-text" font-size="10" fill="#334155" letter-spacing="1">ID: 0x20_LEX</text>
  <text x="1165" y="272" class="mono-text" font-size="10" fill="#334155" text-anchor="end" letter-spacing="1">SYS_CORE: v2.6</text>
</svg>
